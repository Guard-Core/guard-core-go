site_name: guard-core-go
site_description: API security core engine for Go - detection, rate limiting, IP banning, and cloud provider blocking
site_author: Renn F
repo_url: https://github.com/Guard-Core/guard-core-go
repo_name: Guard-Core/guard-core-go

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

nav:
  - Home: index.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Detection: detection.md
  - Agent wiring: agent-wiring.md
  - Conformance: conformance.md
  - Roadmap: roadmap.md
