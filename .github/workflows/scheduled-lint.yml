name: Scheduled Lint

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

env:
  GOTOOLCHAIN: auto

jobs:
  scheduled-vet-govulncheck:
    name: Weekly vet + govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          GOTOOLCHAIN=auto go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
