name: Bug report
description: Guard Core Go does not behave as documented
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: value
    attributes:
      label: Value this delivers
      description: One sentence a user could witness once this is fixed.
      placeholder: "Requests whose JSON body contains a URL are no longer flagged on endpoints that disable suspicious-pattern detection."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Error messages, tracebacks and logs go here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure Guard Core Go with '...'
        2. Send a request to '...'
        3. See error
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: guard-core-go version, Go version, OS.
      placeholder: "guard-core-go 4.4.1, go 1.26, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config with secrets masked.
      render: go
      placeholder: |
        // Minimal setup that reproduces the issue (secrets masked)
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Production or development, consistent or intermittent, workarounds tried.
